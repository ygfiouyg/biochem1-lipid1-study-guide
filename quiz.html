var order=[],idx=0,ok=0,no=0;
function build(){
 order=Q.map(function(_,i){return i});
}
function shuffle(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}}
function render(){
 var box=document.getElementById('box');box.innerHTML='';
 document.getElementById('t').textContent=Q.length;
 order.forEach(function(qi){
  var q=Q[qi];
  var d=document.createElement('div');d.className='q';
  var h='<span class="tag">'+(q.t==='L2'?'محاضرة ٢':'محاضرة ١')+'</span><div class="qt">'+q.q+'</div>';
  q.o.forEach(function(o,j){h+='<div class="opt" data-q="'+qi+'" data-j="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</div>';});
  h+='<div class="exp" id="e'+qi+'"></div>';
  d.innerHTML=h;box.appendChild(d);
 });
}
document.getElementById('box').addEventListener('click',function(e){
 var t=e.target.closest('.opt');if(!t)return;
 if(t.parentNode.dataset.done)return;
 t.parentNode.dataset.done='1';
 var qi=+t.dataset.q,j=+t.dataset.j,q=Q[qi];
 var ops=t.parentNode.querySelectorAll('.opt');
 ops.forEach(function(o){o.classList.remove('right','wrong')});
 ops[q.a].classList.add('right');
 var good=(j===q.a);
 if(!good)t.classList.add('wrong');
 var ex=document.getElementById('e'+qi);
 ex.innerHTML='<b>'+(good?'✅ صح!':'❌ غلط — الإجابة الصحيحة: '+String.fromCharCode(65+q.a))+'</b><br>'+q.e;
 ex.classList.add('show');
 if(good)ok++;else no++;
 idx++;
 upd();
});
function upd(){
 document.getElementById('c').textContent=idx;
 document.getElementById('ok').textContent=ok;
 document.getElementById('no').textContent=no;
 var p=Q.length?Math.round(ok/Q.length*100):0;
 document.getElementById('pct').textContent=p+'%';
 document.getElementById('bar').style.width=(idx/Q.length*100)+'%';
 if(idx===Q.length){
  var m=p>=90?'🏆 ممتاز — جاهز للامتحان!':p>=75?'🔥 جيد جدًا — راجع الناقص':p>=60?'👍 كويس — محتاج مراجعة':'📚 راجع المحاضرات تاني';
  document.getElementById('final').textContent='النتيجة النهائية: '+ok+'/'+Q.length+' ('+p+'%) — '+m;
 }
}
document.getElementById('reset').addEventListener('click',function(){ok=0;no=0;idx=0;document.getElementById('final').textContent='';build();render();upd();});
document.getElementById('shuffle').addEventListener('click',function(){ok=0;no=0;idx=0;document.getElementById('final').textContent='';build();shuffle();render();upd();});
build();render();upd();
</script>
